<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020804">
  <title>TheBaller — Наши контакты</title>
  <style>
    :root {
      color-scheme: dark;
      --green: #39ff78;
      --green-soft: #00d85a;
      --teal: #00e5c4;
      --bg: #020804;
      --panel: rgba(3, 15, 8, .72);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
    }

    /* Запрет выделения и копирования */
    html, body, * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    img { -webkit-user-drag: none; user-drag: none; }

    body {
      height: 100vh;
      height: 100dvh;
      padding: 28px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      overscroll-behavior: none;
      position: relative;
      isolation: isolate;
      color: #f8fafc;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(0, 255, 90, .14), transparent 35%),
        radial-gradient(ellipse at 90% 80%, rgba(0, 210, 125, .12), transparent 38%),
        #020804;
    }

    /* Фон закреплён относительно окна — работает и на мобильных браузерах */
    .lava-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
      background: #020804;
      transform: translateZ(0);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      filter: blur(48px);
      will-change: transform;
      animation: moveBlob 20s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: min(78vw, 850px);
      aspect-ratio: 1;
      top: -24%;
      left: -22%;
      background: radial-gradient(circle, rgba(0, 255, 92, .72) 0%, rgba(0, 190, 65, .34) 36%, transparent 72%);
      animation-duration: 22s;
    }

    .blob-2 {
      width: min(88vw, 950px);
      aspect-ratio: 1;
      right: -28%;
      bottom: -28%;
      background: radial-gradient(circle, rgba(35, 255, 91, .62) 0%, rgba(0, 175, 75, .3) 40%, transparent 72%);
      animation-duration: 25s;
    }

    .blob-3 {
      width: min(70vw, 760px);
      aspect-ratio: 1;
      top: 28%;
      left: 35%;
      background: radial-gradient(circle, rgba(0, 235, 170, .42) 0%, rgba(0, 145, 80, .2) 42%, transparent 72%);
      animation-duration: 28s;
    }

    @keyframes moveBlob {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(8%, 7%, 0) scale(1.08); }
      100% { transform: translate3d(-7%, -9%, 0) scale(.94); }
    }

    .bubbles-container {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -70px;
      border: 1px solid rgba(105, 255, 157, .62);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%,
        rgba(235, 255, 240, .55) 0%,
        rgba(35, 255, 105, .2) 18%,
        rgba(0, 120, 50, .12) 58%,
        rgba(0, 255, 100, .03) 76%);
      box-shadow:
        inset 0 0 12px rgba(160, 255, 185, .25),
        0 0 17px rgba(0, 255, 95, .22);
      opacity: 0;
      will-change: transform, opacity;
      animation: floatUp 15s infinite linear;
    }

    .b1 { left: 8%; width: 30px; height: 30px; animation-duration: 13s; animation-delay: -3s; }
    .b2 { left: 23%; width: 16px; height: 16px; animation-duration: 17s; animation-delay: -9s; }
    .b3 { left: 39%; width: 24px; height: 24px; animation-duration: 15s; animation-delay: -5s; }
    .b4 { left: 56%; width: 13px; height: 13px; animation-duration: 18s; animation-delay: -12s; }
    .b5 { left: 72%; width: 31px; height: 31px; animation-duration: 14s; animation-delay: -7s; }
    .b6 { left: 88%; width: 20px; height: 20px; animation-duration: 16s; animation-delay: -2s; }
    .b7 { left: 16%; width: 12px; height: 12px; animation-duration: 19s; animation-delay: -14s; }
    .b8 { left: 64%; width: 18px; height: 18px; animation-duration: 20s; animation-delay: -10s; }
    .b9 { left: 94%; width: 11px; height: 11px; animation-duration: 15s; animation-delay: -6s; }

    @keyframes floatUp {
      0% { transform: translate3d(0, 0, 0) scale(.8); opacity: 0; }
      12% { opacity: .8; }
      80% { opacity: .7; }
      100% { transform: translate3d(35px, -115vh, 0) scale(1.12); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 450px;
      padding: 42px 34px;
      text-align: center;
      border-radius: 28px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 35px 90px rgba(0, 0, 0, .55);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      border: 2px solid rgba(255, 255, 255, .2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(30px, 8vw, 36px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(100deg, #ffffff 30%, #c9d1d9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-bottom: 32px;
      color: #8b949e;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .copyright {
      margin-top: 26px;
      color: #6e7681;
      font-size: 12px;
      line-height: 1.6;
      letter-spacing: .5px;
    }

    .links-container { display: flex; flex-direction: column; gap: 15px; }

    .btn {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 16px;
      border: 1px solid transparent;
      border-radius: 15px;
      color: #f7fff9;
      text-decoration: none;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: .2px;
      transition: transform .25s ease, background .25s ease, box-shadow .25s ease, border-color .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn svg { width: 22px; height: 22px; flex: 0 0 22px; fill: currentColor; }
    .btn:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    .btn:active { transform: scale(.98); }

    /* Кнопки бесцветные, цвет соцсети появляется при наведении */
    .btn {
      color: #e6ebf0;
      background: rgba(255, 255, 255, .04);
      border-color: rgba(255, 255, 255, .1);
    }

    .btn-tg-channel:hover,
    .btn-tg-channel:focus-visible,
    .btn-tg-private:hover,
    .btn-tg-private:focus-visible {
      color: #fff;
      background: rgba(34, 158, 217, .22);
      border-color: #229ed9;
      box-shadow: 0 0 26px rgba(34, 158, 217, .5);
      transform: translateY(-2px);
    }

    .btn-manager:hover,
    .btn-manager:focus-visible {
      color: #fff;
      background: rgba(139, 92, 246, .25);
      border-color: #8b5cf6;
      box-shadow: 0 0 26px rgba(139, 92, 246, .55);
      transform: translateY(-2px);
    }

    .btn-bot:hover,
    .btn-bot:focus-visible {
      color: #fff;
      background: rgba(255, 255, 255, .16);
      border-color: #fff;
      box-shadow: 0 0 26px rgba(255, 255, 255, .45);
      transform: translateY(-2px);
    }

    .btn-tiktok:hover,
    .btn-tiktok:focus-visible {
      color: #fff;
      background: #0b0b10;
      border-color: #fe2c55;
      box-shadow: -4px -4px 14px rgba(37, 244, 238, .35), 4px 4px 14px rgba(254, 44, 85, .35);
      transform: translateY(-2px);
    }

    .btn-discord:hover,
    .btn-discord:focus-visible {
      color: #fff;
      background: rgba(88, 101, 242, .25);
      border-color: #5865f2;
      box-shadow: 0 0 26px rgba(88, 101, 242, .55);
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      body {
        padding: 22px 15px;
        align-items: center;
      }
      .blob { filter: blur(34px); }
      .blob-1 { width: 115vw; top: -12%; left: -42%; }
      .blob-2 { width: 120vw; right: -43%; bottom: -10%; }
      .blob-3 { width: 100vw; top: 31%; left: 12%; }
      .card {
        max-width: 430px;
        padding: 30px 21px;
        border-radius: 24px;
        background: #000;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }
      .avatar { width: 82px; height: 82px; margin-bottom: 17px; }
      .subtitle { margin-bottom: 26px; letter-spacing: 2.5px; }
      .links-container { gap: 13px; }
      .copyright { margin-top: 20px; font-size: 11px; }
      .btn { min-height: 59px; padding: 14px 12px; gap: 10px; font-size: 15px; }
      .bubble { box-shadow: inset 0 0 10px rgba(160, 255, 185, .28), 0 0 15px rgba(0, 255, 95, .25); }
    }

    @media (max-width: 360px) {
      .card { padding: 27px 16px; }
      .btn { font-size: 14px; gap: 8px; }
      .subtitle { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .bubble { animation-duration: 60s; }
      .btn { transition: none; }
    }
  </style>
</head>
